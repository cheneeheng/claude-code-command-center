name: CI · usage-insights web

on:
  push:
    branches: [main]
    paths:
      - 'apps/usage-insights/web/**'
      - '.github/workflows/usage-insights-web.yml'
  pull_request:
    paths:
      - 'apps/usage-insights/web/**'
      - '.github/workflows/usage-insights-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: web (usage-insights)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/usage-insights/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
