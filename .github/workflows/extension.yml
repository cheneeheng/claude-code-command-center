name: CI · VSCode extension (per-project-plugin-toggler)

on:
  push:
    branches: [main]
    paths:
      - 'apps/per-project-plugin-toggler/**'
      - '!apps/per-project-plugin-toggler/archive/**'
      - '.github/workflows/extension.yml'
  pull_request:
    paths:
      - 'apps/per-project-plugin-toggler/**'
      - '!apps/per-project-plugin-toggler/archive/**'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/per-project-plugin-toggler

jobs:
  lint-extension:
    name: ESLint (extension.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/per-project-plugin-toggler/vscode-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/per-project-plugin-toggler/vscode-extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    defaults:
      run:
        working-directory: apps/per-project-plugin-toggler/vscode-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/per-project-plugin-toggler/vscode-extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

  package-check:
    name: vsce package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/per-project-plugin-toggler/vscode-extension/package-lock.json
      - name: Install dependencies
        working-directory: apps/per-project-plugin-toggler/vscode-extension
        run: npm ci
      - name: Package
        working-directory: apps/per-project-plugin-toggler/vscode-extension
        run: npm run package
