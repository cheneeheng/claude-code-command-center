name: Release · VSCode extension (per-project-plugin-toggler)

# Independent of repo releases: push a pppt-v* tag (e.g. pppt-v1.0.0) to build the
# extension .vsix, attach it to a GitHub release and publish it to the VS Code
# Marketplace. The tag must match vscode-extension/package.json. A manual run
# (workflow_dispatch) builds and attaches only, it never publishes.
on:
  push:
    tags: ['pppt-v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # Marketplace Trusted Publishing (vsce publish --oidc)

defaults:
  run:
    working-directory: apps/per-project-plugin-toggler

jobs:
  release:
    name: Build and attach .vsix
    runs-on: ubuntu-latest   # .vsix is platform-independent JS/webview — build once
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/per-project-plugin-toggler/vscode-extension/package-lock.json

      - name: Assert tag matches package.json
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#pppt-v}"
          PKG=$(node -p "require('./vscode-extension/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag pppt-v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        working-directory: apps/per-project-plugin-toggler/vscode-extension
        run: npm ci

      - name: Package extension
        working-directory: apps/per-project-plugin-toggler/vscode-extension
        run: npm run package

      - name: Extract release notes
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#pppt-v}"
          awk -v h="## [$TAG]" 'index($0, h) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::no CHANGELOG section for $TAG"; exit 1; }

      - name: Attach .vsix to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ github.event_name == 'push' && format('{0}/notes.md', runner.temp) || '' }}
          files: apps/per-project-plugin-toggler/vscode-extension/dist/claude-code-plugin-toggler.vsix

      # Trusted Publishing policy on publisher c4-tools: owner cheneeheng, repo
      # claude-code-command-center, workflow release-extension.yml, no environment.
      # less-code: vsce pinned here, not in devDependencies, because only 4.x has
      # --oidc and packaging stays on the 3.x the lockfile holds; move both together later.
      - name: Publish to the VS Code Marketplace
        if: github.event_name == 'push'
        working-directory: apps/per-project-plugin-toggler/vscode-extension
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath dist/claude-code-plugin-toggler.vsix
